name: CICD TEST API Deployment 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies cicdtestAPI.csproj
      run: dotnet restore ./cicdtestAPI/cicdtestAPI.csproj

    - name: Build Project
      run: dotnet build ./cicdtestAPI/cicdtestAPI.csproj --no-restore

     

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish
      run: dotnet publish ./cicdtestAPI/cicdtestAPI.csproj -c Release -o ./publish
 